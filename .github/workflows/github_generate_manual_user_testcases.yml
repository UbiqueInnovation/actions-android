name: Generate Test Cases for PR

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      github-repository:
        type: string
        required: true
        description: The calling Github repository
    secrets:
      SELFHOSTED_LLM_API_KEY:
        required: true
      SELFHOSTED_LLM_BASE_URL:
        required: true
      GH_TOKEN:
        required: true

jobs:
  generate-test-cases:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Generate and Comment Test Cases
        uses: UbiqueInnovation/actions-android/githubGenerateUserTestcases@main
        with:
          GITHUB_REPOSITORY: ${{ inputs.github-repository }}
          SELFHOSTED_LLM_API_KEY: ${{ secrets.SELFHOSTED_LLM_API_KEY }}
          SELFHOSTED_LLM_BASE_URL: ${{ secrets.SELFHOSTED_LLM_BASE_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
