name: Alpaka Screenshot Compare for Pull-Requests

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      runs-on:
        type: string
        required: false
        default: '["k8s-runner"]'
      android-image-version:
        type: string
        required: false
        default: '2026.03.1-ndk'
        description: The Android image version to use. Default is 2026.03.1-ndk.
      use-git-lfs:
        required: false
        default: false
        type: boolean
        description: 'Use git lfs during repository checkout'
    secrets:
      ANDROID_JENKINS_PAT:
        required: true

jobs:
  build:
    name: Compare screenshots
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: cimg/android:${{ inputs.android-image-version }}
    timeout-minutes: 65
    permissions:
      pull-requests: write
    steps:
      - name: Ensure GH CLI
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: sudo apt-get install -y gh

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.ANDROID_JENKINS_PAT }}
          submodules: 'recursive'
          lfs: ${{ inputs.use-git-lfs }}
          fetch-depth: 10

      - name: Wait for screenshot report
        id: comparison
        env:
          BASE_BRANCH_NAME: ${{ github.event.pull_request.base.ref }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
          FLAVOR: ${{ inputs.flavor }}
        shell: bash
        run: |
          success=false
          for attempt in {1..60}; do

            BODY="<!-- sticky:screenshot-status --><h1>Screenshot Diff Report</h1>"
          
            ENCODED_BRANCH=$(jq -rn --arg v "$BASE_BRANCH_NAME" '$v|@uri')
            curl_url="https://alpaka.ubique.ch/v1/screenshots/diff?referenceBranch=$ENCODED_BRANCH&flavor=$FLAVOR&compareCommitHash=$COMMIT_HASH"
            echo "Running: $curl_url"
            curl_status=0
            response=$(curl -sS --connect-timeout 10 --max-time 30 -w "%{http_code}" -o tmp_response.json "$curl_url") || curl_status=$?
            http_status="${response: -3}"
            retry=false
          
            if (( curl_status != 0 )); then
              echo "Screenshot comparison request failed (curl exit $curl_status, attempt $attempt/60)."
              retry=true
            elif [ "$http_status" = "200" ]; then
              echo "✅ Response received with status: $http_status"
              body=$(cat tmp_response.json)
              reportUrl=$(echo "$body" | jq -r '.reportUrl')
              total=$(echo "$body" | jq -r '.totalScreenshotsCompared')
              referenceCount=$(echo "$body" | jq -r '.referenceScreenshots')
              compareCount=$(echo "$body" | jq -r '.compareScreenshots')
              diff=$(echo "$body" | jq -r '.diffScreenshots')
          
              if (( total == 0 && ( referenceCount > 0 || compareCount == 0 ) )); then
                echo "No screenshots found yet (attempt $attempt/60)."
                retry=true
              elif [ -z "$reportUrl" ] || [ "$reportUrl" = "null" ]; then
                echo "Screenshot report not available yet (attempt $attempt/60)."
                retry=true
              elif (( diff > 0 )); then
                BODY+="&#x274C; Screenshot differences found!"
              else
                BODY+="&#x2705; No screenshot differences."
                success=true
              fi
              BODY+="<br/><a href='$reportUrl'>Screenshot Report</a>"
              BODY+="<br/>Compared Screenshots Total: $total, Diff: $diff"
            else
              echo "Screenshot comparison not available yet (HTTP $http_status, attempt $attempt/60)."
              retry=true
            fi

            if [ "$retry" = true ]; then
              if (( attempt < 60 )); then
                sleep 60
              fi
              continue
            fi
          
            break
          
          done

          if [ "$retry" = true ]; then
            BODY="<!-- sticky:screenshot-status --><h1>Screenshot Diff Report</h1>"
            BODY+="&#x274C; Timed out waiting for the screenshot report after 60 attempts."
          fi

          COMMENT_FILE="$RUNNER_TEMP/screenshot-comment.md"
          printf '%s\n' "$BODY" > "$COMMENT_FILE"
          echo "comment_file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"
          
          if [ "$success" = true ]; then
            exit 0
          else
            exit 1
          fi

      - name: Create or update comment
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: ${{ steps.comparison.outputs.comment_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -n "$COMMENT_FILE" ] && [ -f "$COMMENT_FILE" ]; then
            BODY=$(cat "$COMMENT_FILE")
          else
            BODY="<!-- sticky:screenshot-status --><h1>Screenshot Diff Report</h1>"
            BODY+="&#x274C; Screenshot comparison failed or timed out before a report was available."
          fi
          BODY+="<br/><a href='$RUN_URL'>Workflow run</a>"

          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body|contains("<!-- sticky:screenshot-status -->")) | .id')

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment $COMMENT_ID"
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              -X PATCH -f body="$BODY"
          else
            echo "Creating new comment"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
