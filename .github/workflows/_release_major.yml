name: Update Major Release Tag

on:
  release:
    types: [ released ]

jobs:
  move_tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Update Major Release Tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          MAJOR=${VERSION%%.*}
          git tag -f "${MAJOR}"
          git push origin "${MAJOR}" --force
