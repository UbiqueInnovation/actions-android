name: Build and Upload to Alpaka

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      app-module:
        type: string
        required: false
        default: 'app'
        description: 'The gradle app module (e.g. custom "android:androidApp")'
      concurrency-group:
        type: string
        required: false
        default: ${{ github.workflow }}-${{ github.ref }}
      working-directory:
        type: string
        default: './'
        required: false
        description: 'The working directory of the script, for projects where the gradle project is not in the root folder. Must end with a slash.'
      working-directory-suffix:
        type: string
        default: ''
        required: false
        description: 'Suffix to the working directory of the script, only used for gradle build. Must end with a slash or be empty.'
      setup-rust:
        required: false
        default: false
        type: boolean
      runs-on:
        type: string
        required: false
        default: '["k8s-runner"]'
      jdk:
        type: string
        required: false
        default: '21'
        description: The JDK version to use. Default is 21.
      android-image-version:
        type: string
        required: false
        default: '2026.03.1-ndk'
        description: The Android image version to use. Default is 2026.03.1-ndk.
      sentry-log-level:
        type: string
        required: false
        default: 'warn'
        description: 'The Sentry log level to use. Default is "warn". Other options are "trace", "debug", "info" and "error"'
      use-git-lfs:
        required: false
        default: false
        type: boolean
        description: 'Use git lfs during repository checkout'
      pre-build-script:
        required: false
        type: string
        description: 'Bash script that is executed before the actual build'
      git-branch:
        required: false
        type: string
        default: ${{ github.ref_name }}
        description: 'Can be used to override the Git branch name that will be displayed in Alpaka'
      git-sha:
        required: false
        type: string
        default: ${{ github.sha }}
        description: 'Can be used to override the Git commit hash that will be displayed in Alpaka'
    secrets:
      ANDROID_JENKINS_PAT:
        required: true
      UB_ARTIFACTORY_URL_ANDROID:
        required: true
      UB_ARTIFACTORY_USER:
        required: true
      UB_ARTIFACTORY_PASSWORD:
        required: true
      ALPAKA_UPLOAD_KEY:
        required: false
      UBIQUE_POEDITOR_API_KEY:
        required: false
      ADDITIONAL_GRADLE_PROPS:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SSH_KEY:
        description: 'SSH key to import'
        required: false

jobs:
  build:
    name: Build ${{ inputs.flavor }} Flavor
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: cimg/android:${{ inputs.android-image-version }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    timeout-minutes: 60
    concurrency:
      # Cancel any previous runs that have not yet finished for the configured concurrency group
      group: ${{ inputs.concurrency-group }}
      cancel-in-progress: true
    steps:
      - name: Setup Android app build environment
        id: setup
        uses: UbiqueInnovation/actions-android/.github/actions/android-app-setup@feature/composite-actions
        with:
          checkout-token: ${{ secrets.ANDROID_JENKINS_PAT }}
          use-git-lfs: ${{ inputs.use-git-lfs }}
          jdk: ${{ inputs.jdk }}
          setup-rust: ${{ inputs.setup-rust }}
          flavor: ${{ inputs.flavor }}
          app-module: ${{ inputs.app-module }}

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: UbiqueInnovation/actions-android/.github/actions/ssh-setup@feature/composite-actions
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # Run prebuild script
      - name: "Pre Build Script"
        if: ${{ inputs.pre-build-script }}
        run: ${{ inputs.pre-build-script }}

      - name: Write build_id to file
        run: echo "${{ steps.setup.outputs.build_id }}" > build_id.txt

      - name: Upload build_id as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.flavor }}_build_id
          compression-level: 0
          path: ${{ inputs.working-directory }}/build_id.txt

      # Build and upload app to Alpaka
      - name: Build app
        shell: bash
        run: |
          if [ -n "${{ inputs.working-directory-suffix }}" ]; then
            cd "${{ inputs.working-directory-suffix }}"
          fi
          ./gradlew :${{ inputs.app-module }}:clean :${{ inputs.app-module }}:assembleAndPublishToAlpaka${{ steps.setup.outputs.flavor_capitalized }}Release \
            ${{ github.run_attempt > 1 && '--stacktrace --info' || '' }} \
            -PubiqueMavenUrl=${{ secrets.UB_ARTIFACTORY_URL_ANDROID }} \
            -PubiqueMavenUser=${{ secrets.UB_ARTIFACTORY_USER }} \
            -PubiqueMavenPass=${{ secrets.UB_ARTIFACTORY_PASSWORD }} \
            -PubiquePoEditorAPIKey=${{ secrets.UBIQUE_POEDITOR_API_KEY }} \
            -Pbuild_batch=${{ steps.setup.outputs.build_batch }} \
            -Pbuild_id=${{ steps.setup.outputs.build_id }} \
            -Pbuild_number=${{ steps.setup.outputs.build_number }} \
            -Pbranch=${{ inputs.git-branch }} \
            -PcommitHash=${{ inputs.git-sha }} \
            ${{ secrets.ADDITIONAL_GRADLE_PROPS }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: ${{ github.run_attempt > 1 && 'debug' || inputs.sentry-log-level }}
          ALPAKA_UPLOAD_KEY: ${{ secrets.ALPAKA_UPLOAD_KEY }}

      # Write Alpaka build info to GitHub job summary
      - name: Alpaka Build Summary
        run: |
          echo '### Alpaka Build Info' >> $GITHUB_STEP_SUMMARY
          echo '| | |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          echo '| Build Batch | ${{ steps.setup.outputs.build_batch }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Build ID | ${{ steps.setup.outputs.build_id }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Build Number | ${{ steps.setup.outputs.build_number }} |' >> $GITHUB_STEP_SUMMARY
