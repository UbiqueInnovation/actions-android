name: Build and Upload to Alpaka

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      app-module:
        type: string
        required: false
        default: 'app'
        description: 'The gradle app module (e.g. custom "android:androidApp")'
      concurrency-group:
        type: string
        required: false
        default: ${{ github.workflow }}-${{ github.ref }}
      working-directory:
        type: string
        default: './'
        required: false
        description: 'The working directory of the script, for projects where the gradle project is not in the root folder. Must end with a slash.'
      setup-rust:
        required: false
        default: false
        type: boolean
      runs-on:
        type: string
        required: false
        default: '["k8s-runner"]'
      jdk:
        type: string
        required: false
        default: '21'
        description: The JDK version to use. Default is 21.
      android-image-version:
        type: string
        required: false
        default: '2026.03.1-ndk'
        description: The Android image version to use. Default is 2026.03.1-ndk.
      sentry-log-level:
        type: string
        required: false
        default: 'warn'
        description: 'The Sentry log level to use. Default is "warn". Other options are "trace", "debug", "info" and "error"'
      use-git-lfs:
        required: false
        default: false
        type: boolean
        description: 'Use git lfs during repository checkout'
      pre-build-script:
        required: false
        type: string
        default: ''
        description: 'Bash script that is executed before the actual build'
      git-branch:
        required: false
        type: string
        default: ${{ github.ref_name }}
        description: 'Can be used to override the Git branch name that will be displayed in Alpaka'
      git-sha:
        required: false
        type: string
        default: ${{ github.sha }}
        description: 'Can be used to override the Git commit hash that will be displayed in Alpaka'
    secrets:
      ANDROID_JENKINS_PAT:
        required: true
      UB_ARTIFACTORY_URL_ANDROID:
        required: true
      UB_ARTIFACTORY_USER:
        required: true
      UB_ARTIFACTORY_PASSWORD:
        required: true
      ALPAKA_UPLOAD_KEY:
        required: false
      UBIQUE_POEDITOR_API_KEY:
        required: false
      ADDITIONAL_GRADLE_PROPS:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SSH_KEY:
        description: 'SSH key to import'
        required: false

jobs:
  build:
    name: Build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: cimg/android:${{ inputs.android-image-version }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    timeout-minutes: 60
    concurrency:
      group: ${{ inputs.concurrency-group }}-build
      cancel-in-progress: true
    outputs:
      flavor-capitalized: ${{ steps.setup.outputs.flavor-capitalized }}
      app-module-path: ${{ steps.setup.outputs.app-module-path }}
      build-batch: ${{ steps.setup.outputs.build-batch }}
      build-id: ${{ steps.setup.outputs.build-id }}
      build-number: ${{ steps.setup.outputs.build-number }}
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: UbiqueInnovation/actions-android/.github/actions/ssh-setup@v2
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup Android app build environment
        id: setup
        uses: UbiqueInnovation/actions-android/.github/actions/android-app-setup@v2
        with:
          checkout-token: ${{ secrets.ANDROID_JENKINS_PAT }}
          use-git-lfs: ${{ inputs.use-git-lfs }}
          jdk: ${{ inputs.jdk }}
          setup-rust: ${{ inputs.setup-rust }}
          flavor: ${{ inputs.flavor }}
          app-module: ${{ inputs.app-module }}
          gradle-cache-job-id: '${{ inputs.jdk }}-${{ inputs.app-module }}'
          pre-build-script: ${{ inputs.pre-build-script }}

      - name: Write build_id to file
        run: echo "${{ steps.setup.outputs.build-id }}" > build_id.txt

      - name: Upload build_id as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.flavor }}_build_id
          compression-level: 0
          path: ${{ inputs.working-directory }}/build_id.txt

      - name: Build app
        shell: bash
        run: |
          ./gradlew :${{ inputs.app-module }}:clean :${{ inputs.app-module }}:assemble${{ steps.setup.outputs.flavor-capitalized }}Release \
            ${{ github.run_attempt > 1 && '--stacktrace --info' || '' }} \
            -PubiqueMavenUrl=${{ secrets.UB_ARTIFACTORY_URL_ANDROID }} \
            -PubiqueMavenUser=${{ secrets.UB_ARTIFACTORY_USER }} \
            -PubiqueMavenPass=${{ secrets.UB_ARTIFACTORY_PASSWORD }} \
            -PubiquePoEditorAPIKey=${{ secrets.UBIQUE_POEDITOR_API_KEY }} \
            -Pbuild_batch=${{ steps.setup.outputs.build-batch }} \
            -Pbuild_id=${{ steps.setup.outputs.build-id }} \
            -Pbuild_number=${{ steps.setup.outputs.build-number }} \
            -Pbranch=${{ inputs.git-branch }} \
            -PcommitHash=${{ inputs.git-sha }} \
            ${{ secrets.ADDITIONAL_GRADLE_PROPS }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: ${{ github.run_attempt > 1 && 'debug' || inputs.sentry-log-level }}

      - name: Stash build output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.flavor }}_app_outputs
          path: |
            ${{ inputs.working-directory }}${{ steps.setup.outputs.app-module-path }}/build/outputs/**
            !${{ inputs.working-directory }}${{ steps.setup.outputs.app-module-path }}/build/outputs/**/logs/**
          compression-level: 6
          retention-days: 1
          if-no-files-found: error

  upload:
    name: Upload
    needs: build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: cimg/android:${{ inputs.android-image-version }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    timeout-minutes: 30
    concurrency:
      group: ${{ inputs.concurrency-group }}-upload
      cancel-in-progress: true
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        if: ${{ env.SSH_KEY != '' }}
        uses: UbiqueInnovation/actions-android/.github/actions/ssh-setup@v2
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Setup Android app build environment
        id: setup
        uses: UbiqueInnovation/actions-android/.github/actions/android-app-setup@v2
        with:
          checkout-token: ${{ secrets.ANDROID_JENKINS_PAT }}
          use-git-lfs: ${{ inputs.use-git-lfs }}
          jdk: ${{ inputs.jdk }}
          setup-rust: false
          flavor: ${{ inputs.flavor }}
          app-module: ${{ inputs.app-module }}
          gradle-cache-job-id: '${{ inputs.jdk }}-${{ inputs.app-module }}'
          pre-build-script: ${{ inputs.pre-build-script }}

      - name: Unstash build output
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.flavor }}_app_outputs
          path: ${{ inputs.working-directory }}${{ needs.build.outputs.app-module-path }}/build/outputs/

      # Write Alpaka build info to GitHub job summary
      - name: Alpaka Build Summary
        run: |
          echo '| **Alpaka Build Info** | |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $GITHUB_STEP_SUMMARY
          echo '| Build Batch | ${{ needs.build.outputs.build-batch }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Build ID | ${{ needs.build.outputs.build-id }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Build Number | ${{ needs.build.outputs.build-number }} |' >> $GITHUB_STEP_SUMMARY

      - name: Upload app to Alpaka
        shell: bash
        run: |
          ./gradlew :${{ inputs.app-module }}:publishToAlpaka${{ needs.build.outputs.flavor-capitalized }}Release \
            ${{ github.run_attempt > 1 && '--stacktrace --info' || '' }} \
            -PubiqueMavenUrl=${{ secrets.UB_ARTIFACTORY_URL_ANDROID }} \
            -PubiqueMavenUser=${{ secrets.UB_ARTIFACTORY_USER }} \
            -PubiqueMavenPass=${{ secrets.UB_ARTIFACTORY_PASSWORD }} \
            ${{ secrets.ADDITIONAL_GRADLE_PROPS }}
        env:
          ALPAKA_UPLOAD_KEY: ${{ secrets.ALPAKA_UPLOAD_KEY }}
