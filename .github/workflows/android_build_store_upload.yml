name: Build and Upload to Play Store

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      app-module:
        type: string
        required: false
        default: 'app'
        description: 'The gradle app module (e.g. custom "android:androidApp")'
      setup-rust-tool-chain:
        required: false
        default: false
        type: boolean
      runs-on:
        type: string
        required: false
        default: '["k8s-runner"]'
      jdk:
        type: string
        required: false
        default: '17'
        description: 'The JDK version to use. Default is 17.'
      android-image-version:
        type: string
        required: false
        default: '2024.04.1-ndk'
        description: 'The Android image version to use. Default is 2024.04.1-ndk.'
      sentry-log-level:
        type: string
        required: false
        default: 'warn'
        description: 'The Sentry log level to use. Default is "warn". Other options are "trace", "debug", "info" and "error"'
      use-git-lfs:
        type: boolean
        required: false
        default: false
        description: 'Use git lfs during repository checkout'
    secrets:
      ANDROID_JENKINS_PAT:
        required: true
      UB_ARTIFACTORY_URL_ANDROID:
        required: true
      UB_ARTIFACTORY_USER:
        required: true
      UB_ARTIFACTORY_PASSWORD:
        required: true
      UBIQUE_POEDITOR_API_KEY:
        required: true
      ADDITIONAL_GRADLE_PROPS:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      UPLOAD_KEY_STORE_PASSWORD:
        required: true
      UPLOAD_KEY_PASSWORD:
        required: true
      ANDROID_PUBLISHER_CREDENTIALS:
        required: true

jobs:
  build:
    name: Build ${{ inputs.flavor }} Flavor
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: cimg/android:${{ inputs.android-image-version }}
    timeout-minutes: 60
    concurrency:
      # Cancel any previous runs that have not yet finished for this workflow, git ref and app module (for apps that have multiple apps in the same workflow)
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.app-module }}
      cancel-in-progress: true
    env:
      AAB_STAGING_DIR: .tmp/publishing_aab
    steps:
      # Checkout repository and submodules
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          token: ${{ secrets.ANDROID_JENKINS_PAT }}
          submodules: 'recursive'
          lfs: ${{ inputs.use-git-lfs }}

      # Set build variables for reuse in multiple steps
      - name: Set Build Variables
        id: vars
        shell: bash
        run: |
          flavor=${{ inputs.flavor }}
          appModulePath=${{ inputs.app-module }}
          appModulePath=${appModulePath//:/\/}
          echo "flavor_capitalized=${flavor~}" >> "$GITHUB_OUTPUT"
          echo "app_module_path=$appModulePath" >> "$GITHUB_OUTPUT"

      # Setup JDK environment
      - name: Set up JDK
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.jdk }}

      # Setup rust Tool Chain
      - name: Setup rust Tool Chain
        uses: actions-rust-lang/setup-rust-toolchain@v1.9.0
        if: ${{ inputs.setup-rust-tool-chain }}

      # Setup gradle and build the app
      - name: Build app
        uses: gradle/actions/setup-gradle@v3.1.0
        with:
          arguments: |
            :${{ inputs.app-module }}:bundle${{ steps.vars.outputs.flavor_capitalized }}ReleaseUpload
            -PubiqueMavenUrl=${{ secrets.UB_ARTIFACTORY_URL_ANDROID }}
            -PubiqueMavenUser=${{ secrets.UB_ARTIFACTORY_USER }}
            -PubiqueMavenPass=${{ secrets.UB_ARTIFACTORY_PASSWORD }}
            -PubiquePoEditorAPIKey=${{ secrets.UBIQUE_POEDITOR_API_KEY }}
            ${{ secrets.ADDITIONAL_GRADLE_PROPS }}
        env:
          UPLOAD_KEY_STORE_PASSWORD: ${{ secrets.UPLOAD_KEY_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: ${{ inputs.sentry-log-level }}

      # Copy the app to a temporary folder because the publish step clears the default aab output folder
      - name: Stage AAB
        run: |
          mkdir -p "$AAB_STAGING_DIR"
          cp "${{ steps.vars.outputs.app_module_path }}"/build/outputs/bundle/${{ inputs.flavor }}ReleaseUpload/*.aab "$AAB_STAGING_DIR"

      # Upload the .aab artifact
      - name: Save app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            ${{ env.AAB_STAGING_DIR }}/*.aab

      # Publish the .aab to the play store
      - name: Upload app artifact
        uses: gradle/actions/setup-gradle@v3.1.0
        with:
          arguments: |
            :${{ inputs.app-module }}:publish${{ steps.vars.outputs.flavor_capitalized }}ReleaseUploadBundle
            --artifact-dir ${{ env.AAB_STAGING_DIR }}
            -PubiqueMavenUrl=${{ secrets.UB_ARTIFACTORY_URL_ANDROID }}
            -PubiqueMavenUser=${{ secrets.UB_ARTIFACTORY_USER }}
            -PubiqueMavenPass=${{ secrets.UB_ARTIFACTORY_PASSWORD }}
            -PubiquePoEditorAPIKey=${{ secrets.UBIQUE_POEDITOR_API_KEY }}
            ${{ secrets.ADDITIONAL_GRADLE_PROPS }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: ${{ inputs.sentry-log-level }}
