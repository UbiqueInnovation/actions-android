name: Run a gradle task

on:
  workflow_call:
    inputs:
      task:
        type: string
        required: true
      gradle-args:
        type: string
        required: false
      concurrency-group:
        type: string
        required: false
        default: ${{ github.workflow }}-${{ github.ref }}
      working-directory:
        type: string
        default: './'
        required: false
        description: 'The working directory of the script, for projects where the gradle project is not in the root folder. Must end with a slash.'
      runs-on:
        type: string
        required: false
        default: '["k8s-runner"]'
      android-image-version:
        type: string
        required: false
        default: '2026.03.1-ndk'
        description: The Android image version to use. Default is 2026.03.1-ndk.
      use-git-lfs:
        required: false
        default: false
        type: boolean
        description: 'Use git lfs during repository checkout'
      jdk:
        type: string
        required: false
        default: '21'
        description: 'The JDK version to use. Default is 21.'
      pre-build-script:
        required: false
        type: string
        default: ''
        description: 'Bash script that is executed before the actual build'
    secrets:
      ANDROID_JENKINS_PAT:
        required: false
        description: 'Optional PAT for checking out private repositories or submodules. Falls back to the default GITHUB_TOKEN if not set.'
      UB_ARTIFACTORY_URL:
        required: true
      UB_ARTIFACTORY_REPO_ANDROID:
        required: true
      UB_ARTIFACTORY_USER:
        required: true
      UB_ARTIFACTORY_PASSWORD:
        required: true

jobs:
  task:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: cimg/android:${{ inputs.android-image-version }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    timeout-minutes: 60
    concurrency:
      # Cancel any previous runs that have not yet finished for the configured concurrency group
      group: ${{ inputs.concurrency-group }}
      cancel-in-progress: true
    steps:
      - name: Setup Android environment
        uses: UbiqueInnovation/actions-android/.github/actions/android-base-setup@v2
        with:
          checkout-token: ${{ secrets.ANDROID_JENKINS_PAT || github.token }}
          use-git-lfs: ${{ inputs.use-git-lfs }}
          jdk: ${{ inputs.jdk }}
          setup-rust: 'false'
          gradle-cache-job-id: '${{ inputs.jdk }}-${{ inputs.task }}'
          pre-build-script: ${{ inputs.pre-build-script }}

      - name: Run Gradle task
        run: ./gradlew ${{ inputs.task }} ${{ inputs.gradle-args }} ${{ github.run_attempt > 1 && '--stacktrace --info' || '' }}
        env:
          UB_ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}
          UB_ARTIFACTORY_REPO_ANDROID: ${{ secrets.UB_ARTIFACTORY_REPO_ANDROID }}
          UB_ARTIFACTORY_URL_ANDROID: '${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_ANDROID }}'
          UB_ARTIFACTORY_USER: ${{ secrets.UB_ARTIFACTORY_USER }}
          UB_ARTIFACTORY_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
