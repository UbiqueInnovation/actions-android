name: Setup Android Environment
description: >
  Base setup for Android CI jobs. Checks out the repository, installs zstd,
  optionally sets up a JDK, and optionally sets up the Rust toolchain.
  All inputs must be supplied by the caller — defaults live in the workflow files.

inputs:
  checkout-token:
    description: 'Token used for checkout. Falls back to the default GITHUB_TOKEN if not set.'
    default: ${{ github.token }}
  use-git-lfs:
    description: 'Use git lfs during repository checkout.'
  fetch-depth:
    description: 'Number of commits to fetch during checkout.'
  setup-jdk:
    description: 'Whether to set up a JDK.'
  jdk:
    description: 'The JDK version to use.'
  setup-rust:
    description: 'Whether to set up the Rust toolchain.'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        token: ${{ inputs.checkout-token }}
        submodules: 'recursive'
        lfs: ${{ inputs.use-git-lfs }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up JDK
      if: ${{ inputs.setup-jdk != 'false' }}
      uses: actions/setup-java@v5.2.0
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.jdk }}

    - name: Install zstd
      shell: bash
      run: sudo apt-get install -y zstd

    - name: Setup Rust toolchain
      if: ${{ inputs.setup-rust == 'true' }}
      uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
