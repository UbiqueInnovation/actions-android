name: Setup Android Environment
description: >
  Base setup for Android CI jobs. Checks out the repository, sets up a JDK,
  sets up the Gradle cache, and optionally sets up the Rust toolchain.

inputs:
  checkout-token:
    description: 'Token used for checkout.'
    required: true
  use-git-lfs:
    description: 'Use git lfs during repository checkout.'
    required: true
  jdk:
    description: 'The JDK version to use.'
    required: true
  setup-rust:
    description: 'Whether to set up the Rust toolchain.'
    required: true
  gradle-cache-job-id:
    description: 'Job ID for Gradle cache scoping (e.g. JDK version + module).'
    required: true
  pre-build-script:
    description: 'Bash script that is executed after the environment setup and before the build.'
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        token: ${{ inputs.checkout-token }}
        submodules: 'recursive'
        lfs: ${{ inputs.use-git-lfs }}
        fetch-depth: 10

    - name: Set up JDK
      uses: actions/setup-java@v5.2.0
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.jdk }}

    - name: Setup Gradle Cache
      uses: UbiqueInnovation/actions-android/.github/actions/gradle-cache-setup@v2
      with:
        job-id: ${{ inputs.gradle-cache-job-id }}

    - name: Setup Rust toolchain
      if: ${{ inputs.setup-rust == 'true' }}
      uses: actions-rust-lang/setup-rust-toolchain@v1.15.4

    - name: Pre Build Script
      if: ${{ inputs.pre-build-script != '' }}
      shell: bash
      run: ${{ inputs.pre-build-script }}
