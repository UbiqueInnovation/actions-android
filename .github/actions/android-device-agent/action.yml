name: Android Device Agent
description: >
  Connects to a real Android device over Tailscale + adb, installs a built APK,
  and runs an LLM agent (driving the device via the mobile-mcp MCP server)
  against it with a given prompt, returning the agent's output.

inputs:
  tailscale-auth-key:
    description: 'Tailscale/Headscale auth key (store as a secret).'
    required: true
  tailscale-login-server:
    description: 'Headscale/Tailscale control server URL.'
    required: false
    default: 'https://headscale.ubique.rocks'
  device-address:
    description: 'Tailscale IP or hostname of the Android device under test.'
    required: true
  adb-port:
    description: 'TCP port the device is listening on for adb (adb tcpip).'
    required: false
    default: '5555'
  adb-key:
    description: 'Pre-authorized adb private key (adbkey) for authenticating to the device (store as a secret).'
    required: true
  apk-url:
    description: 'URL to download the APK to install on the device.'
    required: true
  prompt:
    description: 'Instructions for the agent on what to do with the app.'
    required: true
  selfhosted-llm-api-key:
    description: 'OpenAI (or compatible) API key for the agent model.'
    required: true
  selfhosted-llm-base-url:
    description: 'Base URL of the OpenAI-compatible endpoint for the agent model (pass from a secret).'
    required: true
  model:
    description: 'Model name to use for the agent.'
    required: false
    default: 'default'
  mcp-command:
    description: 'Full command that launches the device-control MCP server (e.g. "uvx --python 3.13 android-mcp").'
    required: false
    default: 'uvx --python 3.13 android-mcp'
  keep-open-on-failure:
    description: 'Keep the runner alive on failure for debugging.'
    required: false
    default: 'false'

outputs:
  agent-output:
    description: 'The final output text produced by the agent.'
    value: ${{ steps.publish.outputs.agent-output }}

runs:
  using: composite
  steps:
    - name: Connect to Tailscale
      uses: UbiqueInnovation/tailscale-action@main
      with:
        auth-key: ${{ inputs.tailscale-auth-key }}
        login-server: ${{ inputs.tailscale-login-server }}
        extra-login-args: '--accept-dns --ssh'

    - name: Verify Tailscale is up
      shell: bash
      run: |
        tscale status
        ip4=$(tscale ip -4)
        if [ -z "$ip4" ]; then
          echo "Tailscale did not obtain a tailnet IPv4 address after login"
          exit 1
        fi
        echo "Tailscale tailnet IPv4: ${ip4}"

    - name: Install ADB authentication key
      shell: bash
      env:
        ADB_KEY: ${{ inputs.adb-key }}
      run: |
        set -euo pipefail
        if [ -z "${ADB_KEY}" ]; then
          echo "::error::adb-key is required (pass the pre-authorized adb private key as a secret)"
          exit 1
        fi
        mkdir -p "${HOME}/.android"
        printf '%s\n' "${ADB_KEY}" > "${HOME}/.android/adbkey"
        chmod 600 "${HOME}/.android/adbkey"

    - name: Connect to device via adb
      shell: bash
      env:
        DEVICE: ${{ inputs.device-address }}
        PORT: ${{ inputs.adb-port }}
      run: |
        set -euo pipefail
        # Restart the adb server so it loads the key we just installed.
        adb kill-server 2>/dev/null || true
        adb connect "${DEVICE}:${PORT}"
        adb devices
        if ! adb devices | grep -qE "^[[:space:]]*[^[:space:]]+[[:space:]]+device[[:space:]]*$"; then
          echo "No adb device in 'device' state after connect to ${DEVICE}:${PORT}"
          adb devices
          echo "Hint: the device must already trust this adb key (its public key installed in /data/misc/adb/adb_keys)."
          exit 1
        fi

    - name: Reset uiautomator2 on-device state
      shell: bash
      env:
        DEVICE: ${{ inputs.device-address }}
        PORT: ${{ inputs.adb-port }}
      run: |
        set -euo pipefail
        # The UiAutomator2Server instrumentation keeps running on the device after the host
        # session that started it ends. Its orphaned UiAutomationService registration blocks
        # every subsequent connection with "UiAutomationService ... already registered!".
        # Force-stop both packages (what uiautomator2's own reset does) so android-mcp can
        # start cleanly.
        adb -s "${DEVICE}:${PORT}" shell am force-stop com.github.uiautomator || true
        adb -s "${DEVICE}:${PORT}" shell am force-stop com.github.uiautomator.test || true
        sleep 3
        echo "Stale uiautomator2 processes (should be none):"
        adb -s "${DEVICE}:${PORT}" shell ps -A 2>/dev/null | grep -E "com\.github\.uiautomator" || echo "  (none)"

    - name: Download APK
      shell: bash
      env:
        APK_URL: ${{ inputs.apk-url }}
      run: |
        curl -fL --retry 3 -o app.apk "$APK_URL"
        ls -l app.apk
    - name: Resolve app package name
      id: pkg
      shell: bash
      run: |
        set -euo pipefail
        AAPT="$(command -v aapt || true)"
        [ -z "${AAPT}" ] && AAPT="$(command -v aapt2 || true)"
        [ -z "${AAPT}" ] && AAPT="$(ls -1 "${ANDROID_HOME:-/opt/android/sdk}"/build-tools/*/aapt* 2>/dev/null | sort -V | tail -n1 || true)"
        if [ -z "${AAPT}" ]; then
          echo "Could not find aapt/aapt2 to inspect the APK"
          exit 1
        fi
        echo "Using: ${AAPT}"
        badging="$("${AAPT}" dump badging app.apk 2>/dev/null || true)"
        pkg="$(printf '%s\n' "${badging}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
        if [ -z "${pkg}" ]; then
          echo "Could not resolve package name from app.apk (aapt badging head below)"
          printf '%s\n' "${badging}" | head -n 20 || true
          exit 1
        fi
        echo "package-name=${pkg}" >> "${GITHUB_OUTPUT}"
        echo "App package name: ${pkg}"

    - name: Install app on device
      shell: bash
      run: adb install -r -g app.apk
    - name: Launch target app in foreground
      shell: bash
      env:
        PACKAGE: ${{ steps.pkg.outputs.package-name }}
      run: |
        set -euo pipefail
        echo "Bringing ${PACKAGE} to the foreground ..."
        adb shell monkey -p "${PACKAGE}" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 \
          || echo "Warning: monkey launch failed; the agent may relaunch it itself"
        sleep 3
        echo "Current focused window:"
        adb shell dumpsys window 2>/dev/null | grep -iE "mCurrentFocus|mFocusedApp" | head -n 5 || true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install agent dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install openai-agents uv

    - name: Run agent
      id: agent
      shell: bash
      env:
        SELFHOSTED_LLM_API_KEY: ${{ inputs.selfhosted-llm-api-key }}
        SELFHOSTED_LLM_BASE_URL: ${{ inputs.selfhosted-llm-base-url }}
        MODEL: ${{ inputs.model }}
        MCP_COMMAND: ${{ inputs.mcp-command }}
        APP_PACKAGE: ${{ steps.pkg.outputs.package-name }}
        ANDROID_MCP_DEVICE: ${{ inputs.device-address }}:${{ inputs.adb-port }}
        PROMPT: ${{ inputs.prompt }}
      run: |
        set -o pipefail
        # Always materialise the inlined agent script first (guaranteed
        # present even if the composite-action checkout is partial), then
        # prefer the checked-out run_agent.py when it exists so that file
        # remains the editable source of truth.
        cat > /tmp/run_agent.py <<'PYEOF'
        import asyncio
        import os
        import shlex
        import sys

        from agents import Agent, Runner, RunHooks
        from agents.mcp import MCPServerStdio
        from agents.models.openai_chatcompletions import OpenAIChatCompletionsModel
        from openai import AsyncOpenAI


        def build_model() -> OpenAIChatCompletionsModel:
            api_key = os.environ.get("SELFHOSTED_LLM_API_KEY", "")
            base_url = os.environ.get("SELFHOSTED_LLM_BASE_URL", "").strip()
            model_name = os.environ.get("MODEL", "default")

            if not api_key:
                raise RuntimeError("SELFHOSTED_LLM_API_KEY is not set")

            client = AsyncOpenAI(
                api_key=api_key,
                base_url=base_url if base_url else None,
            )
            return OpenAIChatCompletionsModel(model=model_name, openai_client=client)


        def build_instructions(app_package: str) -> str:
            parts = [
                "You are an autonomous Android QA tester. A single Android device is "
                "connected over adb and the app under test is already installed."
            ]
            if app_package:
                parts.append(
                    f"The app under test has Android package name '{app_package}'. It has "
                    "been launched into the foreground. Interact ONLY with this app. If it "
                    f"is not in the foreground, bring it back (relaunch it by package name "
                    f"'{app_package}'). Do NOT open, launch, or interact with any other app."
                )
            parts.append(
                "Drive the device with the android-mcp tools. The reliable workflow is: "
                "1) Call Snapshot to read the current screen. By default it returns a text "
                "tree of the UI (element text, resource-id, class, and coordinates) - read "
                "that text; you do not need a vision screenshot for most steps. "
                "2) To act, prefer ClickBySelector using resourceId or text - it handles "
                "layout reflow and is far more reliable than blind coordinate taps. Only "
                "fall back to Click with coordinates from the Snapshot tree when no "
                "selector matches. "
                "3) After each action, call Snapshot again and confirm the screen changed "
                "as expected. If an action has no effect, do NOT repeat it: use "
                "WaitForElement for content that is still loading, press Back, or try a "
                "different element. Use Press for hardware buttons (back, home, enter, "
                "volume, ...) and Type to enter text. If the app shows a crash, a blank "
                "screen, or a stuck loading screen, note it and stop guessing. Finish with "
                "a concise written report of exactly what you did, what you observed, and "
                "any crashes, errors, or unexpected behavior."
            )
            return " ".join(parts)


        class LoggingHooks(RunHooks):
            """Print each turn and tool call so a stuck/looping run is diagnosable."""

            def __init__(self) -> None:
                self._turn = 0

            def _log(self, msg: str) -> None:
                try:
                    print(msg, flush=True)
                except Exception:  # noqa: BLE001 - logging must never break the run
                    pass

            async def on_llm_start(self, context, agent, system_prompt, input_items) -> None:
                self._turn += 1
                self._log(f"[agent] turn {self._turn}: calling model")

            async def on_llm_end(self, context, agent, response) -> None:
                try:
                    for item in getattr(response, "output", []) or []:
                        t = getattr(item, "type", None)
                        if t in (
                            "function_call",
                            "computer_call",
                            "mcp_call",
                            "custom_tool_call",
                            "tool_search_call",
                        ):
                            name = getattr(item, "name", "?")
                            args = getattr(item, "arguments", "") or getattr(item, "input", "")
                            self._log(f"[agent]   tool_call: {name} {str(args)[:500]}")
                        elif t == "message":
                            text = "".join(
                                getattr(p, "text", "") for p in getattr(item, "content", []) or []
                            )
                            if text.strip():
                                self._log(f"[agent]   assistant: {text.strip()[:500]}")
                except Exception:  # noqa: BLE001
                    pass

            async def on_tool_start(self, context, agent, tool) -> None:
                self._log(f"[agent]   -> tool start: {getattr(tool, 'name', tool)}")

            async def on_tool_end(self, context, agent, tool, result) -> None:
                self._log(
                    f"[agent]   <- tool end: {getattr(tool, 'name', tool)} "
                    f"result={str(result)[:300]}"
                )


        def mcp_params(mcp_command: str) -> dict:
            parts = shlex.split(mcp_command)
            if not parts:
                raise RuntimeError("MCP_COMMAND is empty")
            return {"command": parts[0], "args": parts[1:]}


        async def run_agent(prompt: str, mcp_command: str, app_package: str) -> str:
            async with MCPServerStdio(
                name="android-mcp",
                params=mcp_params(mcp_command),
            ) as server:
                agent = Agent(
                    name="android-tester",
                    instructions=build_instructions(app_package),
                    model=build_model(),
                    mcp_servers=[server],
                )
                max_turns = int(os.environ.get("MAX_TURNS", "40"))
                result = await Runner.run(
                    agent, prompt, max_turns=max_turns, hooks=LoggingHooks()
                )
                return result.final_output


        def main() -> None:
            prompt = os.environ.get("PROMPT", "")
            mcp_command = os.environ.get("MCP_COMMAND", "uvx --python 3.13 android-mcp")
            app_package = os.environ.get("APP_PACKAGE", "")

            if not prompt:
                raise RuntimeError("PROMPT is not set")

            print(f"[agent] MCP server: {mcp_command}", flush=True)
            print(f"[agent] target app: {app_package or '(not set)'}", flush=True)

            output = asyncio.run(run_agent(prompt, mcp_command, app_package))
            print("\n=== AGENT FINAL OUTPUT ===\n", flush=True)
            print(output)


        if __name__ == "__main__":
            try:
                main()
            except Exception as exc:  # noqa: BLE001
                print(f"android-device-agent failed: {exc}", file=sys.stderr)
                sys.exit(1)
        PYEOF
        if [ -f "${{ github.action_path }}/run_agent.py" ]; then
          cp "${{ github.action_path }}/run_agent.py" /tmp/run_agent.py
        fi
        python /tmp/run_agent.py | tee agent-output.txt

    - name: Publish agent output to job summary
      id: publish
      shell: bash
      env:
        DEVICE_ADDRESS: ${{ inputs.device-address }}
        ADB_PORT: ${{ inputs.adb-port }}
        MODEL: ${{ inputs.model }}
      run: |
        agent_output="$(cat agent-output.txt)"
        {
          echo "### Android Device Agent"
          echo
          echo "- **Device:** \`${DEVICE_ADDRESS}:${ADB_PORT}\`"
          echo "- **Model:** \`${MODEL}\`"
          echo
          echo "<details>"
          echo "<summary>Agent output</summary>"
          echo
          echo '```'
          echo "$agent_output"
          echo '```'
          echo
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
        {
          echo "agent-output<<ANDROID_AGENT_OUTPUT_EOF"
          echo "$agent_output"
          echo "ANDROID_AGENT_OUTPUT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Dump Tailscale debug info on failure
      if: failure()
      uses: UbiqueInnovation/tailscale-action/debug@feature/debug-dump
      with:
        socket-path: /tmp/tailscaled.sock

    - name: Keep workflow open on failure
      if: failure() && inputs.keep-open-on-failure == 'true'
      shell: bash
      run: |
        ip4="$(tscale ip -4 2>/dev/null || true)"
        echo "Workflow failed; keeping runner alive for debugging."
        if [ -n "${ip4}" ]; then
          echo "Tailscale IPv4: ${ip4}"
          echo "SSH into the runner with: ssh <user>@${ip4}  (Tailscale SSH enabled via --ssh)"
        fi
        sleep infinity
