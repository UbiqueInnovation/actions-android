name: Android Device Agent
description: >
  Connects to a real Android device over Tailscale + adb, installs a built APK,
  and runs an LLM agent (driving the device via the mobile-mcp MCP server)
  against it with a given prompt, returning the agent's output.

inputs:
  tailscale-auth-key:
    description: 'Tailscale/Headscale auth key (store as a secret).'
    required: true
  tailscale-login-server:
    description: 'Headscale/Tailscale control server URL.'
    required: false
    default: 'https://headscale.ubique.rocks'
  device-address:
    description: 'Tailscale IP or hostname of the Android device under test.'
    required: true
  adb-port:
    description: 'TCP port the device is listening on for adb (adb tcpip).'
    required: false
    default: '5555'
  adb-key:
    description: 'Pre-authorized adb private key (adbkey) for authenticating to the device (store as a secret).'
    required: true
  apk-url:
    description: 'URL to download the APK to install on the device.'
    required: true
  prompt:
    description: 'Instructions for the agent on what to do with the app.'
    required: true
  selfhosted-llm-api-key:
    description: 'OpenAI (or compatible) API key for the agent model.'
    required: true
  selfhosted-llm-base-url:
    description: 'Base URL of the OpenAI-compatible endpoint for the agent model (pass from a secret).'
    required: true
  model:
    description: 'Model name to use for the agent.'
    required: false
    default: 'default'
  mcp-package:
    description: 'npm package that exposes the device-control MCP server.'
    required: false
    default: '@mobilenext/mobile-mcp@latest'
  keep-open-on-failure:
    description: 'Keep the runner alive on failure for debugging.'
    required: false
    default: 'false'

outputs:
  agent-output:
    description: 'The final output text produced by the agent.'
    value: ${{ steps.publish.outputs.agent-output }}

runs:
  using: composite
  steps:
    - name: Connect to Tailscale
      uses: UbiqueInnovation/tailscale-action@main
      with:
        auth-key: ${{ inputs.tailscale-auth-key }}
        login-server: ${{ inputs.tailscale-login-server }}
        extra-login-args: '--accept-dns --ssh'

    - name: Verify Tailscale is up
      shell: bash
      run: |
        tscale status
        ip4=$(tscale ip -4)
        if [ -z "$ip4" ]; then
          echo "Tailscale did not obtain a tailnet IPv4 address after login"
          exit 1
        fi
        echo "Tailscale tailnet IPv4: ${ip4}"

    - name: Install ADB authentication key
      shell: bash
      env:
        ADB_KEY: ${{ inputs.adb-key }}
      run: |
        set -euo pipefail
        if [ -z "${ADB_KEY}" ]; then
          echo "::error::adb-key is required (pass the pre-authorized adb private key as a secret)"
          exit 1
        fi
        mkdir -p "${HOME}/.android"
        printf '%s\n' "${ADB_KEY}" > "${HOME}/.android/adbkey"
        chmod 600 "${HOME}/.android/adbkey"

    - name: Connect to device via adb
      shell: bash
      env:
        DEVICE: ${{ inputs.device-address }}
        PORT: ${{ inputs.adb-port }}
      run: |
        set -euo pipefail
        # Restart the adb server so it loads the key we just installed.
        adb kill-server 2>/dev/null || true
        adb connect "${DEVICE}:${PORT}"
        adb devices
        if ! adb devices | grep -qE "^[[:space:]]*[^[:space:]]+[[:space:]]+device[[:space:]]*$"; then
          echo "No adb device in 'device' state after connect to ${DEVICE}:${PORT}"
          adb devices
          echo "Hint: the device must already trust this adb key (its public key installed in /data/misc/adb/adb_keys)."
          exit 1
        fi

    - name: Download APK
      shell: bash
      env:
        APK_URL: ${{ inputs.apk-url }}
      run: |
        curl -fL --retry 3 -o app.apk "$APK_URL"
        ls -l app.apk

    - name: Install app on device
      shell: bash
      run: adb install -r -g app.apk

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install agent dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install openai-agents

    - name: Run agent
      id: agent
      shell: bash
      env:
        SELFHOSTED_LLM_API_KEY: ${{ inputs.selfhosted-llm-api-key }}
        SELFHOSTED_LLM_BASE_URL: ${{ inputs.selfhosted-llm-base-url }}
        MODEL: ${{ inputs.model }}
        MCP_PACKAGE: ${{ inputs.mcp-package }}
        PROMPT: ${{ inputs.prompt }}
      # The agent script is inlined below via a quoted heredoc (literal, no
      # shell expansion) so the action is self-contained and does not depend on
      # any sibling file being materialised in the composite-action checkout.
      run: |
        set -o pipefail
        cat > /tmp/run_agent.py <<'PYEOF'
        import asyncio
        import os
        import sys

        from agents import Agent, Runner
        from agents.mcp import MCPServerStdio
        from agents.models.openai_chatcompletions import OpenAIChatCompletionsModel
        from openai import AsyncOpenAI


        INSTRUCTIONS = (
            "You are an autonomous Android QA tester. An Android device is connected "
            "and the app under test is already installed. Use the available "
            "mobile-mcp tools to interact with the device (list devices, launch and "
            "terminate apps, tap, long-press, swipe, type, press hardware buttons, "
            "take screenshots, and read device logs). Start by listing the available "
            "devices to confirm the connection. Follow the task below, verify the "
            "outcome on screen, and finish with a concise written report of what you "
            "did and what you observed, including any errors or unexpected behavior."
        )


        def build_model() -> OpenAIChatCompletionsModel:
            api_key = os.environ.get("SELFHOSTED_LLM_API_KEY", "")
            base_url = os.environ.get("SELFHOSTED_LLM_BASE_URL", "").strip()
            model_name = os.environ.get("MODEL", "default")

            if not api_key:
                raise RuntimeError("SELFHOSTED_LLM_API_KEY is not set")

            client = AsyncOpenAI(
                api_key=api_key,
                base_url=base_url if base_url else None,
            )
            return OpenAIChatCompletionsModel(model=model_name, openai_client=client)


        async def run_agent(prompt: str, mcp_package: str) -> str:
            async with MCPServerStdio(
                name="android-mcp",
                params={"command": "npx", "args": ["-y", mcp_package]},
            ) as server:
                agent = Agent(
                    name="android-tester",
                    instructions=INSTRUCTIONS,
                    model=build_model(),
                    mcp_servers=[server],
                )
                result = await Runner.run(agent, prompt, max_turns=80)
                return result.final_output


        def main() -> None:
            prompt = os.environ.get("PROMPT", "")
            mcp_package = os.environ.get("MCP_PACKAGE", "@mobilenext/mobile-mcp@latest")

            if not prompt:
                raise RuntimeError("PROMPT is not set")

            output = asyncio.run(run_agent(prompt, mcp_package))
            print(output)


        if __name__ == "__main__":
            try:
                main()
            except Exception as exc:  # noqa: BLE001
                print(f"android-device-agent failed: {exc}", file=sys.stderr)
                sys.exit(1)
        PYEOF
        python /tmp/run_agent.py | tee agent-output.txt

    - name: Publish agent output to job summary
      id: publish
      shell: bash
      env:
        DEVICE_ADDRESS: ${{ inputs.device-address }}
        ADB_PORT: ${{ inputs.adb-port }}
        MODEL: ${{ inputs.model }}
      run: |
        agent_output="$(cat agent-output.txt)"
        {
          echo "### Android Device Agent"
          echo
          echo "- **Device:** \`${DEVICE_ADDRESS}:${ADB_PORT}\`"
          echo "- **Model:** \`${MODEL}\`"
          echo
          echo "<details>"
          echo "<summary>Agent output</summary>"
          echo
          echo '```'
          echo "$agent_output"
          echo '```'
          echo
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
        {
          echo "agent-output<<ANDROID_AGENT_OUTPUT_EOF"
          echo "$agent_output"
          echo "ANDROID_AGENT_OUTPUT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Dump Tailscale debug info on failure
      if: failure()
      uses: UbiqueInnovation/tailscale-action/debug@feature/debug-dump
      with:
        socket-path: /tmp/tailscaled.sock

    - name: Keep workflow open on failure
      if: failure() && inputs.keep-open-on-failure == 'true'
      shell: bash
      run: |
        ip4="$(tscale ip -4 2>/dev/null || true)"
        echo "Workflow failed; keeping runner alive for debugging."
        if [ -n "${ip4}" ]; then
          echo "Tailscale IPv4: ${ip4}"
          echo "SSH into the runner with: ssh <user>@${ip4}  (Tailscale SSH enabled via --ssh)"
        fi
        sleep infinity
